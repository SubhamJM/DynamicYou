# ==============================================================================
# HYPRIDLE CONFIGURATION — BALANCED IDLE MANAGEMENT
# ==============================================================================

general {
    lock_cmd = pidof hyprlock || hyprlock       # Avoid starting multiple hyprlock instances
    before_sleep_cmd = loginctl lock-session    # Lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # Turn display on after resume to avoid black screen
    ignore_dbus_inhibit = false                 # Honor D-Bus idle inhibitor
    ignore_systemd_inhibit = false              # Honor systemd-inhibit
}

# ── 1. DIM SCREEN (2.5 MINUTES / 150 SECONDS) ────────────────────────────────
listener {
    timeout = 150                                 # 2.5 min
    on-timeout = brightnessctl -s set 20%         # Set monitor backlight to 20% (avoids 0 on OLED)
    on-resume = brightnessctl -r                  # Restore monitor backlight
}

# ── 2. LOCK SCREEN (5 MINUTES / 300 SECONDS) ─────────────────────────────────
listener {
    timeout = 300                                 # 5 min
    on-timeout = loginctl lock-session            # Lock screen via hyprlock
}

# ── 3. TURN OFF DISPLAY (5.5 MINUTES / 330 SECONDS) ──────────────────────────
listener {
    timeout = 330                                 # 5.5 min
    on-timeout = hyprctl dispatch dpms off        # Turn off display when timeout passes
    on-resume = hyprctl dispatch dpms on          # Turn on display on any activity
}

# ── 4. SUSPEND SYSTEM (20 MINUTES / 1200 SECONDS) ────────────────────────────
listener {
    timeout = 1200                                # 20 min
    on-timeout = systemctl suspend                # Suspend system
}
