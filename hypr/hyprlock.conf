# ==============================================================================
# HYPRLOCK CONFIGURATION — DYNAMIC NOTCH & POWER MODULE
# ==============================================================================

# Dynamic Theme Colors (Fallback defaults to Catppuccin / Neutral Dark)
$accent = rgb(89b4fa)
$accentAlpha = 89b4fa
$card_bg = rgba(14, 14, 18, 0.85)
$text = rgb(248, 250, 252)
$subtext = rgb(148, 163, 184)
$error = rgb(247, 118, 142)

# Load theme colors generated by apply-theme.sh
source = ~/.config/active-theme/hyprlock-colors.conf

# ── GENERAL SETTINGS ─────────────────────────────────────────────────────────
general {
    hide_cursor = false
    ignore_empty_input = true
    immediate_render = true
}

# ── FROSTED GLASS BACKGROUND (SCREENSHOT BLUR) ───────────────────────────────
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# ── TOP DYNAMIC NOTCH SURFACE ────────────────────────────────────────────────
# Shifted up by 22px so the top edge is flat against the screen bezel with rounded bottom corners
shape {
    monitor =
    size = 184, 64
    rounding = 20
    color = rgba(0, 0, 0, 1.0)
    position = 0, 22
    halign = center
    valign = top
    zindex = 1
}

# Date & Clock inside Notch (matches Quickshell idle notch: Sun 20  01:16)
label {
    monitor =
    text = cmd[update:1000] echo "<span foreground='##8e8e93'>$(date +'%a') </span><span foreground='##$accentAlpha'>$(date +'%-d') </span> <b>$(date +'%I')<span foreground='##$accentAlpha'>:</span>$(date +'%M')</b>"
    text_align = center
    color = rgb(248, 250, 252)
    font_size = 12
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, -12
    halign = center
    valign = top
    zindex = 2
}

# ── CENTER CLOCK & DATE ──────────────────────────────────────────────────────
# Hero Time
label {
    monitor =
    text = $TIME
    text_align = center
    color = rgba(248, 250, 252, 0.95)
    font_size = 82
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 145
    halign = center
    valign = center
}

# Date Subtitle
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    text_align = center
    color = rgba(148, 163, 184, 0.85)
    font_size = 16
    font_family = JetBrainsMono Nerd Font Medium
    position = 0, 80
    halign = center
    valign = center
}

# ── USER PROFILE GREETING ────────────────────────────────────────────────────
label {
    monitor =
    text =   $USER
    text_align = center
    color = rgba(248, 250, 252, 0.85)
    font_size = 14
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 18
    halign = center
    valign = center
}

# ── PASSWORD CAPSULE INPUT FIELD ─────────────────────────────────────────────
# Matches the Quickshell Material You capsule design
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 1
    dots_size = 0.28
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    outer_color = $accent
    inner_color = rgba(14, 14, 18, 0.85)
    font_color = rgb(248, 250, 252)
    fade_on_empty = false
    rounding = 24
    placeholder_text = <span foreground="##94a3b8">Enter Password...</span>
    hide_input = false
    position = 0, -42
    halign = center
    valign = center
    check_color = $accent
    fail_color = rgb(247, 118, 142)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
}

# ── UNLOCK HINT ──────────────────────────────────────────────────────────────
label {
    monitor =
    text = 󰌑 Press Enter to Unlock
    text_align = center
    color = rgba(100, 116, 139, 0.70)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 0, -98
    halign = center
    valign = center
}

# ── INTERACTIVE POWER MODULE (MOUSE CLICKABLE) ──────────────────────────────
# Compact capsule container with balanced padding
shape {
    monitor =
    size = 152, 44
    rounding = 22
    color = rgba(14, 14, 18, 0.85)
    border_size = 1
    border_color = rgba(255, 255, 255, 0.1)
    position = 0, 35
    halign = center
    valign = bottom
    zindex = 1
}

# 1. Suspend Button (Left)
label {
    monitor =
    text =  󰒲 
    text_align = center
    color = rgba(248, 250, 252, 0.85)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = -44, 46
    halign = center
    valign = bottom
    zindex = 2
    onclick = systemctl suspend
}

# 2. Reboot Button (Center)
label {
    monitor =
    text =  󰜉 
    text_align = center
    color = rgba(248, 250, 252, 0.85)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 46
    halign = center
    valign = bottom
    zindex = 2
    onclick = systemctl reboot
}

# 3. Shutdown / Power Off Button (Right)
label {
    monitor =
    text =  󰐥 
    text_align = center
    color = rgb(247, 118, 142)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 44, 46
    halign = center
    valign = bottom
    zindex = 2
    onclick = systemctl poweroff
}
