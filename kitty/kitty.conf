# --- Theme
# Sourced dynamically from Dank Material Shell (matugen)
include dank-theme.conf
include dank-tabs.conf
# include matugen.conf

# -- Core Settings ---
shell fish
term xterm-kitty
allow_remote_control yes
listen_on unix:/tmp/mykitty
confirm_os_window_close 0
linux_display_server wayland

# --- Typography ---
include font.conf

# --- Cursor  ---
include cursor.conf

# --- Visuals & Transparency ---
background_opacity         1.0
dynamic_background_opacity no
background_blur            0
window_padding_width       10 14

# --- Tab bar ---
tab_bar_edge bottom
tab_bar_style powerline

# --- URL & Interaction ---
detect_urls yes
url_style   curly
undercurl_style thin-dense
copy_on_select clipboard
strip_trailing_spaces smart

# --- Scrollback ---
scrollback_lines 10000
wheel_scroll_min_lines 1

# --- Window Management & Panes ---
enabled_layouts splits
inactive_text_alpha   1.0
dim_opacity           1.0

# --- Keybinds ---
# Forward Ctrl+Tab and Ctrl+Shift+Tab to terminal applications (Neovim tab/buffer switching)
map ctrl+tab send_text all \e[9;5u
map ctrl+shift+tab send_text all \e[9;6u

map ctrl+shift+f      show_scrollback
map page_up           scroll_page_up
map page_down         scroll_page_down

# Manual split keybinds
map ctrl+shift+enter  launch --location=vsplit
map ctrl+shift+\      launch --location=hsplit

# Toggle Cursor Trail (VS Code Static vs Animated Trail)
map ctrl+shift+f9     launch --type=background ~/.local/bin/toggle-cursor-trail

# Explicitly allow clicking URLs with Ctrl+Left Click
mouse_map ctrl+left click ungrabbed mouse_handle_click selection link prompt

# If you're inside Neovim or a TUI and want Ctrl+Click to still work
mouse_map ctrl+left click grabbed mouse_handle_click selection link prompt

# Reduce the delay before redrawing (default is 10)
repaint_delay 2

# Reduce the input batching delay (default is 3)
input_delay 0

# include current-theme.conf
