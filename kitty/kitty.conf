font_size 11.0

shell /usr/bin/fish

disable_ligatures yes
enable_audio_bell no

shell_integration disabled

url_style curly

remember_window_size no
window_padding_width 12 16
window_margin_width 4 4 0 4
cursor_blink_interval 0

background_opacity 0.92
background_blur 20
scrollbar_handle_opacity 0
scrollbar_track_opacity 0
scrollbar_track_hover_opacity 0
confirm_os_window_close 0

sync_to_monitor no

repaint_delay 8
input_delay 3

cursor_trail 1
cursor_trail_decay 0.1 0.3

include ~/.config/active-theme/kitty-colors.conf
